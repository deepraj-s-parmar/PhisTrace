<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up · ThreatScope</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #f4f6f9;
    --sidebar: #0f1923;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1a202c;
    --muted: #64748b;
    --accent: #1e88e5;
    --danger: #e53e3e;
    --success: #38a169;
    --warning: #dd6b20;
    --purple: #6b46c1;
    --radius: 12px;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
    --transition: all 0.2s ease;
  }

  [data-theme="dark"] {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    padding: 20px;
  }

  .auth-container {
    display: flex;
    width: 100%;
    max-width: 1200px;
    background: var(--card);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    transition: var(--transition);
  }

  .auth-brand {
    flex: 1;
    background: linear-gradient(135deg, #0f1923 0%, #1a2736 100%);
    padding: 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: white;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 40px;
  }
  .logo-icon {
    width: 44px;
    height: 44px;
    background: var(--accent);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .logo-text {
    font-size: 20px;
    font-weight: 700;
  }
  .logo-sub {
    font-size: 11px;
    opacity: 0.6;
    margin-top: 2px;
  }

  .stats-badge {
    background: rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 24px;
    margin-top: 40px;
  }
  .stats-badge .number {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .stats-badge .label {
    font-size: 12px;
    opacity: 0.7;
  }

  .auth-form {
    flex: 1;
    padding: 48px;
    background: var(--card);
    transition: var(--transition);
  }

  .form-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .form-header h1 {
    font-size: 28px;
    margin-bottom: 8px;
  }
  .form-header p {
    color: var(--muted);
    font-size: 14px;
  }

  .theme-toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
  }

  .input-group {
    margin-bottom: 16px;
  }
  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  .input-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
  }
  .input-field {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    transition: var(--transition);
    outline: none;
  }
  .input-field:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(30,136,229,0.1);
  }
  .input-icon {
    position: relative;
  }
  .input-icon i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 14px;
  }
  .input-icon .input-field {
    padding-left: 40px;
  }

  .password-strength {
    margin-top: 6px;
    font-size: 11px;
  }
  .strength-bars {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }
  .strength-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    transition: var(--transition);
  }
  .strength-bar.active-weak { background: var(--danger); }
  .strength-bar.active-medium { background: var(--warning); }
  .strength-bar.active-strong { background: var(--success); }

  .terms {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 20px 0;
    font-size: 12px;
    color: var(--muted);
  }
  .terms input {
    margin-top: 2px;
    accent-color: var(--accent);
  }
  .terms a {
    color: var(--accent);
    text-decoration: none;
  }

  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover {
    background: #1565c0;
    transform: translateY(-1px);
  }

  .divider {
    position: relative;
    text-align: center;
    margin: 24px 0;
  }
  .divider::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--border);
  }
  .divider span {
    position: relative;
    background: var(--card);
    padding: 0 12px;
    font-size: 12px;
    color: var(--muted);
  }

  .social-buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }
  .social-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: transparent;
    cursor: pointer;
    transition: var(--transition);
    color: var(--text);
  }
  .social-btn:hover {
    background: var(--bg);
  }

  .signin-link {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 20px;
  }
  .signin-link a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }

  .alert {
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .alert-error {
    background: rgba(229,62,62,0.1);
    border-left: 3px solid var(--danger);
    color: var(--danger);
  }
  .alert-success {
    background: rgba(56,161,105,0.1);
    border-left: 3px solid var(--success);
    color: var(--success);
  }

  @media (max-width: 900px) {
    .auth-brand { display: none; }
    .auth-form { padding: 32px; }
  }
  @media (max-width: 480px) {
    .auth-form { padding: 24px; }
    .input-row { grid-template-columns: 1fr; gap: 0; }
    .form-header h1 { font-size: 24px; }
    .social-buttons { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="auth-container">
  <div class="auth-brand">
    <div>
      <div class="logo">
        <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <div>
          <div class="logo-text">ThreatScope</div>
          <div class="logo-sub">URL & Email Intelligence</div>
        </div>
      </div>
      <div class="stats-badge">
        <div class="number">50,000+</div>
        <div class="label">Threats detected daily</div>
        <div style="margin-top: 12px;">
          <div class="number">99.7%</div>
          <div class="label">Detection accuracy</div>
        </div>
      </div>
      <div class="brand-features" style="margin-top: 30px;">
        <div class="feature-item" style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
          <i class="fa-solid fa-check-circle" style="color: var(--success);"></i>
          <span style="font-size: 13px;">Free 14-day trial</span>
        </div>
        <div class="feature-item" style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
          <i class="fa-solid fa-check-circle" style="color: var(--success);"></i>
          <span style="font-size: 13px;">No credit card required</span>
        </div>
        <div class="feature-item" style="display: flex; align-items: center; gap: 12px;">
          <i class="fa-solid fa-check-circle" style="color: var(--success);"></i>
          <span style="font-size: 13px;">Cancel anytime</span>
        </div>
      </div>
    </div>
    <div class="brand-footer">
      <i class="fa-solid fa-shield-heart"></i> Trusted by 10,000+ security teams
    </div>
  </div>

  <div class="auth-form">
    <div class="theme-toggle" onclick="toggleTheme()">
      <i class="fa-solid fa-moon"></i>
    </div>
    
    <div class="form-header">
      <h1>Create account</h1>
      <p>Start your 14-day free trial today</p>
    </div>

    <div id="alertMessage" class="alert" style="display:none"></div>

    <form id="signupForm" onsubmit="return handleSignUp(event)">
      <div class="input-row">
        <div class="input-group">
          <label class="input-label">First name</label>
          <div class="input-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="firstName" class="input-field" placeholder="John" required>
          </div>
        </div>
        <div class="input-group">
          <label class="input-label">Last name</label>
          <div class="input-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="lastName" class="input-field" placeholder="Doe" required>
          </div>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Email address</label>
        <div class="input-icon">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" class="input-field" placeholder="john@company.com" required>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Password</label>
        <div class="input-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" class="input-field" placeholder="Create a strong password" required oninput="checkPasswordStrength()">
        </div>
        <div class="password-strength">
          <div class="strength-bars" id="strengthBars">
            <div class="strength-bar"></div>
            <div class="strength-bar"></div>
            <div class="strength-bar"></div>
          </div>
          <span id="strengthText" style="color: var(--muted);"></span>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Confirm password</label>
        <div class="input-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="confirmPassword" class="input-field" placeholder="Confirm your password" required>
        </div>
      </div>

      <label class="terms">
        <input type="checkbox" id="termsCheckbox" required>
        <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
      </label>

      <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-user-plus"></i> Create free account
      </button>
    </form>

    <div class="divider"><span>or sign up with</span></div>

    <div class="social-buttons">
      <button class="social-btn" onclick="socialSignup('google')">
        <i class="fa-brands fa-google"></i> Google
      </button>
      <button class="social-btn" onclick="socialSignup('github')">
        <i class="fa-brands fa-github"></i> GitHub
      </button>
      <button class="social-btn" onclick="socialSignup('microsoft')">
        <i class="fa-brands fa-microsoft"></i> Microsoft
      </button>
    </div>

    <div class="signin-link">
      Already have an account? <a href="signin.html">Sign in</a>
    </div>
  </div>
</div>

<script>
  function checkPasswordStrength() {
    const password = document.getElementById('password').value;
    const bars = document.querySelectorAll('.strength-bar');
    const strengthText = document.getElementById('strengthText');
    
    let strength = 0;
    if (password.length >= 8) strength++;
    if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
    if (password.match(/[0-9]/)) strength++;
    if (password.match(/[^a-zA-Z0-9]/)) strength++;
    
    bars.forEach((bar, index) => {
      bar.classList.remove('active-weak', 'active-medium', 'active-strong');
      if (index < strength) {
        if (strength <= 2) bar.classList.add('active-weak');
        else if (strength === 3) bar.classList.add('active-medium');
        else bar.classList.add('active-strong');
      }
    });
    
    if (strength <= 2) strengthText.textContent = 'Weak password';
    else if (strength === 3) strengthText.textContent = 'Medium password';
    else strengthText.textContent = 'Strong password!';
  }

  function handleSignUp(event) {
    event.preventDefault();
    
    const firstName = document.getElementById('firstName').value;
    const lastName = document.getElementById('lastName').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const termsChecked = document.getElementById('termsCheckbox').checked;

    if (password !== confirmPassword) {
      showAlert('Passwords do not match', 'error');
      return false;
    }

    if (!termsChecked) {
      showAlert('Please agree to the Terms of Service', 'error');
      return false;
    }

    if (password.length < 8) {
      showAlert('Password must be at least 8 characters', 'error');
      return false;
    }

    showAlert(`Welcome ${firstName}! Account created successfully. Redirecting to dashboard...`, 'success');
    
    // Store user info
    localStorage.setItem('threatscope_user', email);
    localStorage.setItem('threatscope_name', `${firstName} ${lastName}`);
    
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 1500);
    
    return false;
  }

  function showAlert(message, type) {
    const alertDiv = document.getElementById('alertMessage');
    alertDiv.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${message}`;
    alertDiv.className = `alert alert-${type === 'success' ? 'success' : 'error'}`;
    alertDiv.style.display = 'flex';
    setTimeout(() => {
      alertDiv.style.display = 'none';
    }, 3000);
  }

  function socialSignup(provider) {
    showAlert(`Signing up with ${provider}... (demo feature)`, 'success');
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 1000);
  }

  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    if (isDark) {
      html.removeAttribute('data-theme');
      localStorage.setItem('theme', 'light');
    } else {
      html.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    }
  }

  // Load saved theme
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
</script>
</body>
</html>
